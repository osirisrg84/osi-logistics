<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OSI Driver Portal · Tutorial</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0e2040;background:linear-gradient(160deg,#0e2040,#0b1424);color:#fff;font-family:Segoe UI,Arial,sans-serif;min-height:100vh}
.w{max-width:460px;margin:0 auto;padding:22px 18px 40px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.brand{font-weight:800;letter-spacing:2px;font-size:13px;opacity:.85}.lang button{background:rgba(255,255,255,.1);color:#fff;border:0;padding:6px 12px;border-radius:8px;font-weight:700;cursor:pointer}.lang button.on{background:#2563eb}
h1{font-size:26px;margin:6px 0 4px}p.sub{margin:0 0 16px;color:#cbd5e1;font-size:15px}
video{width:100%;border-radius:18px;background:#000;box-shadow:0 10px 40px rgba(0,0,0,.5)}
ol{list-style:none;padding:0;margin:18px 0}ol li{display:flex;gap:12px;align-items:center;background:rgba(255,255,255,.07);padding:12px 14px;border-radius:12px;margin-bottom:8px;font-size:15px}ol li b{background:#2563eb;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex:none}
a.btn{display:block;text-align:center;text-decoration:none;font-weight:700;padding:14px;border-radius:12px;margin-top:10px;font-size:15px}.p{background:#2563eb;color:#fff}.s{background:rgba(255,255,255,.1);color:#fff}
.foot{margin-top:22px;font-size:13px;color:#94a3b8;text-align:center}</style></head><body><div class="w">
<div class="top"><div class="brand">OSI LOGISTICS</div><div class="lang"><button data-l="es" class="on">ES</button><button data-l="en">EN</button></div></div>
<h1 id="h"></h1><p class="sub" id="sub"></p>
<video controls playsinline preload="metadata" poster="/videos/poster-driver.jpg" src="/videos/OSI-Tutorial-Driver.mp4"></video>
<ol><li><b>1</b><span id="s1"></span></li><li><b>2</b><span id="s2"></span></li><li><b>3</b><span id="s3"></span></li></ol>
<a class="btn p" id="login" href="https://driver.osilogistics.com/driver/login"></a><a class="btn s" id="reg" href="https://driver.osilogistics.com/driver/register"></a><a class="btn s" id="pdf" href="/guias/OSI-Guia-Driver-ES-EN.pdf"></a>
<div class="foot" id="foot"></div></div>
<script>var T={"es": {"h": "Tutorial de inicio rápido", "sub": "Mira cómo funciona el Driver Portal en menos de un minuto.", "s1": "Conéctate y activa el GPS", "s2": "Acepta las ofertas que te convienen", "s3": "Confirma cada paso hasta la entrega", "pdf": "Descargar la guía (PDF)", "login": "Entrar al Driver Portal", "reg": "Crear mi cuenta", "foot": "¿Dudas? Responde a cualquier correo de OSI y te ayudamos."}, "en": {"h": "Quick start tutorial", "sub": "See how the Driver Portal works in under a minute.", "s1": "Go online and turn on GPS", "s2": "Accept the offers that suit you", "s3": "Confirm each step until delivery", "pdf": "Download the guide (PDF)", "login": "Log in to the Driver Portal", "reg": "Create my account", "foot": "Questions? Reply to any OSI email and we will help."}};function set(l){if(!T[l])l='es';var d=T[l];['h','sub','s1','s2','s3','foot'].forEach(function(k){document.getElementById(k).textContent=d[k]});document.getElementById('login').textContent=d.login;document.getElementById('reg').textContent=d.reg;document.getElementById('pdf').textContent=d.pdf;document.documentElement.lang=l;document.querySelectorAll('.lang button').forEach(function(b){b.className=b.dataset.l===l?'on':''})}
var q=new URLSearchParams(location.search).get('lang');set(q==='en'?'en':'es');document.querySelectorAll('.lang button').forEach(function(b){b.onclick=function(){set(b.dataset.l)}});</script></body></html>
